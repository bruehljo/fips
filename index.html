<title>Fips sitzt fest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Caveat:wght@600&display=swap">
<style>
/* Layout: storybook adventure — night-forest calendar with 24 wooden doors; each day a painted room (point & click) with Fips' speech panel; locks are opened with a four-ring cipher wheel */
:root{
  --night:#1c2560;
  --night-2:#28378a;
  --night-3:#3448a6;
  --moss:#9ccf6b;
  --amber:#ffc66d;
  --gold:#e3a93f;
  --cream:#f8eedb;
  --paper:#f4e8cc;
  --ink:#241a13;
  --berry:#d85a46;
  --muted:#aab4e6;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Literata",Georgia,"Times New Roman",serif;
  --hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  color-scheme:dark;
}
html,body{min-height:100%}
body{background:var(--night);color:var(--cream);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-text-size-adjust:100%;
  background-image:radial-gradient(1200px 520px at 50% -120px,#2d5c5a 0%,transparent 70%),radial-gradient(700px 400px at 100% 100%,rgba(216,90,70,.14) 0%,transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--night)}
button{font:inherit;color:inherit}
.wrap{max-width:1120px;margin:0 auto;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 48px}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
.btn{font-family:var(--display);font-weight:600;font-size:1.1rem;border:0;border-radius:16px;padding:.8em 1.3em;cursor:pointer;background:linear-gradient(180deg,#ffd58a,#f3b45a);color:var(--ink);box-shadow:0 4px 0 #b57e2c,0 10px 24px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #b57e2c}
.btn.ghost{background:rgba(248,238,219,.06);color:var(--cream);box-shadow:inset 0 0 0 2px rgba(248,238,219,.28)}
.btn.ghost:active{transform:translateY(1px)}
.btn.small{font-size:.95rem;padding:.55em 1em;border-radius:12px}
.btn:focus-visible,.door:focus-visible,.icon-btn:focus-visible,input:focus-visible{outline:3px solid var(--amber);outline-offset:3px}
.ring:focus,.hot:focus{outline:none}
.ring:focus-visible .rot{filter:drop-shadow(0 0 7px #ffc66d) drop-shadow(0 0 2px #ffc66d)}
.icon-btn{width:46px;height:46px;border-radius:14px;border:0;background:rgba(248,238,219,.09);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:24px;height:24px}
.eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.1em;text-transform:uppercase;font-size:.78rem;color:var(--moss)}

/* ---------- intro & calendar ---------- */
.hero{border-radius:24px;overflow:hidden;background:#0f1540;box-shadow:0 24px 60px rgba(0,0,0,.4),inset 0 0 0 1px rgba(248,238,219,.08)}
.hero{height:clamp(160px,36vw,400px)}
.hero svg{display:block;width:100%;height:100%}
.intro{display:grid;gap:24px;margin-top:24px;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);align-items:start}
.story-more{margin-top:8px}
.story-more summary{cursor:pointer;font-family:var(--display);font-weight:600;color:var(--moss);list-style:none;display:inline-flex;align-items:center;gap:8px;padding:.3em 0}
.story-more summary::-webkit-details-marker{display:none}
.story-more summary::after{content:"▾";transition:transform .2s}
.story-more[open] summary::after{transform:rotate(180deg)}
.story-more p{margin-top:.8em}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--ink);font-family:var(--display);font-weight:600;padding:.7em 1.1em;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:40;animation:toast 2.6s both}
@keyframes toast{0%,100%{opacity:0;transform:translate(-50%,10px)}12%,85%{opacity:1;transform:translate(-50%,0)}}
.intro h1{font-size:clamp(2.6rem,6vw,4.4rem);color:var(--amber)}
.story p{margin:0 0 .9em;max-width:62ch}
.story .lead::first-letter{font-family:var(--display);font-size:3.1em;float:left;line-height:.8;padding:.06em .1em 0 0;color:var(--amber)}
.card{background:linear-gradient(180deg,#2f3f9a,#243078);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px;box-shadow:inset 0 0 0 1px rgba(248,238,219,.09),0 16px 40px rgba(0,0,0,.25)}
.card label{font-family:var(--display);font-weight:600}
.card input,.card select,.ov select{font:inherit;font-size:1.2rem;padding:.7em .9em;border-radius:12px;border:2px solid rgba(248,238,219,.18);background:#161e52;color:var(--cream)}
.ov select{font-size:1rem;width:100%}
.note-small{font-size:.9rem;color:var(--muted)}
.preview-tag{display:inline-block;font-family:var(--display);font-size:.78rem;background:var(--berry);color:#fff;border-radius:999px;padding:.2em .7em;margin-left:.4em;vertical-align:middle;letter-spacing:.04em}
.cal-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:14px;margin:22px 0 16px}
.cal-head h1{font-size:clamp(2rem,4.6vw,3.2rem);color:var(--amber)}
.cal-head p{margin:.3em 0 0;color:var(--muted);max-width:58ch}
.shard-head{display:flex;align-items:baseline;gap:10px;margin-top:6px}
.shard-head .count{font-family:var(--display);font-weight:600;color:var(--cream);font-size:.95rem}
.shards{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 22px}
.shard{width:26px;height:33px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--ink);font-size:1.05rem;clip-path:polygon(50% 0,100% 30%,82% 100%,18% 100%,0 30%);background:rgba(248,238,219,.1)}
.shard.on{background:linear-gradient(160deg,#fff7d6,#ffd36f 60%,#e8a43a);font-size:.95rem}
.shard.next{box-shadow:inset 0 0 0 2px rgba(255,198,109,.5)}
.doors{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.door{position:relative;aspect-ratio:3/4;border:0;padding:0;cursor:pointer;color:var(--cream);background:transparent;font-family:var(--display)}
.door svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.door .num{position:absolute;left:0;right:0;top:54.9%;height:0;display:flex;align-items:center;justify-content:center;font-size:clamp(1.1rem,3.2vw,2.1rem);font-weight:700;color:#3a2412;line-height:1}
.door .tag{position:absolute;left:0;right:0;bottom:4.5%;text-align:center;font-size:clamp(.52rem,2.3vw,.8rem);font-weight:600;letter-spacing:.03em;color:#f8eedb}
.door.wait{filter:saturate(.45) brightness(.62);cursor:default}
.door.open{filter:drop-shadow(0 0 16px rgba(255,198,109,.45))}
.door.open .num{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.foot{margin-top:28px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;color:var(--muted);font-size:.9rem}
.foot .grp{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:1.05rem;letter-spacing:.04em;background:var(--input,#161e52);border:1px dashed rgba(255,255,255,.35);border-radius:10px;padding:12px 14px;text-align:center;word-break:break-all;user-select:all}
.btn.danger{color:#ffb4a6;box-shadow:inset 0 0 0 2px rgba(216,90,70,.5)}
.btn.danger.sure{background:var(--berry);color:#fff;box-shadow:0 4px 0 #8a2e22}
.btn .ic{width:18px;height:18px;vertical-align:-3px;margin-right:6px}

/* ---------- room ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.topbar h2{font-size:clamp(1.25rem,3vw,1.7rem);margin-right:auto}
.topbar h2 span{display:block;font-size:.62em;color:var(--moss);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.scene-wrap{position:relative;margin:0;border-radius:24px;overflow:hidden;background:#0f1540;box-shadow:0 20px 50px rgba(0,0,0,.45),inset 0 0 0 1px rgba(248,238,219,.08)}
.scene{position:relative}
.scene svg{display:block;width:100%;height:auto;-webkit-user-select:none;user-select:none}
.swipe{display:none;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-size:.85rem;color:var(--muted);padding:8px 12px 10px;background:#141b4a}
.swipe svg{width:18px;height:18px}
.swipe.gone{opacity:.35}
.hot{cursor:pointer}
.hot .halo{animation:halo 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hot .spark{animation:twinkle 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.hot:hover .spark,.hot:focus-visible .spark{animation-duration:.9s}
.hot:focus-visible .halo{stroke:var(--amber);stroke-width:3}
.hot.seen .spark{animation:none;opacity:.45;transform:scale(.7)}
.hot.seen .halo{animation:none;opacity:.2}
@keyframes twinkle{0%,100%{opacity:.75;transform:scale(.8) rotate(0deg)}50%{opacity:1;transform:scale(1.12) rotate(18deg)}}
@keyframes halo{0%,100%{opacity:.35;transform:scale(.9)}50%{opacity:.7;transform:scale(1.08)}}
.flame{animation:flick 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes flick{25%{transform:scale(1,1.08) rotate(-2deg)}60%{transform:scale(.94,1) rotate(2deg)}}
.speech{display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:start;margin-top:16px;background:linear-gradient(180deg,#2f3f9a,#243078);border-radius:22px;padding:16px 18px;box-shadow:inset 0 0 0 1px rgba(248,238,219,.09)}
.avatar{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#5a6fd0,#243078 75%);overflow:hidden;flex:none;box-shadow:inset 0 0 0 3px rgba(248,238,219,.12)}
.avatar svg{width:100%;height:100%;display:block}
.speech p{margin:0;max-width:70ch}
.speech .who{font-family:var(--display);font-weight:600;color:var(--amber);font-size:.95rem;margin-bottom:2px}

function doorLock(cx,top,pics,sym){
  const hasSym=sym!=null, h=hasSym?104:78, ty=top+(hasSym?42:9), ly=top+(hasSym?71:38), py=top+(hasSym?86:53);
  return `<rect x="${cx-39}" y="${top+4}" width="80" height="${h}" rx="7" fill="#000" opacity=".3"/><rect x="${cx-40}" y="${top}" width="80" height="${h}" rx="7" fill="url(#gBrass)" stroke="#6d4a14" stroke-width="2"/><rect x="${cx-37}" y="${top+3}" width="74" height="${h-6}" rx="5" fill="none" stroke="#fff" stroke-width="1.2" opacity=".35"/><rect x="${cx-40}" y="${top}" width="80" height="${h}" rx="7" fill="url(#gBoard)" opacity=".6"/>${[[cx-33,top+7],[cx+33,top+7],[cx-33,top+h-7],[cx+33,top+h-7]].map(([a,b])=>`<circle cx="${a}" cy="${b}" r="2.2" fill="#6d4a14"/><circle cx="${a-.6}" cy="${b-.6}" r=".9" fill="#ffe9a8"/>`).join('')}
  ${hasSym?`${symAt(sym,cx,top+18,.72,'#4a2e0c')}<line x1="${cx-32}" y1="${top+34}" x2="${cx+32}" y2="${top+34}" stroke="#8a6420" stroke-width="1"/>`:''}

  <line x1="${cx-34}" y1="${ly}" x2="${cx+34}" y2="${ly}" stroke="#8a6420" stroke-width="1"/>
  ${pics.map((p,i)=>`<g transform="translate(${cx-23+i*23} ${py}) scale(.9)">${PICT[p](0,0)}</g>`).join('')}`;
}

function fips(x,y,s=1,mood='talk'){
  const P=FIPS[mood==='happy'?'cheer':mood==='sit'?'sit':'stand'];
  const spark=mood==='happy'?`<g class="twinkle"><polygon points="${starPts(-80,-215,9,3.6)}" fill="#ffd24a"/><polygon points="${starPts(84,-150,7,2.8)}" fill="#ffd24a"/><polygon points="${starPts(-70,-110,6,2.4)}" fill="#fff"/><polygon points="${starPts(70,-240,6,2.4)}" fill="#fff"/></g>`:'';
  return `<g transform="translate(${x} ${y}) scale(${s})"><ellipse cx="0" cy="-3" rx="${P.w*.42}" ry="9" fill="#1a1030" opacity=".3" filter="url(#soft)"/><image href="${P.src}" x="${-P.w/2}" y="${-P.h}" width="${P.w}" height="${P.h}" preserveAspectRatio="xMidYMax meet"/>${spark}</g>`;
}

function sock(i,x,y,kind){
  const d=`M${x-13} ${y}H${x+13}V${y+56}Q${x+13} ${y+66} ${x+24} ${y+68}Q${x+38} ${y+72} ${x+34} ${y+84}Q${x+30} ${y+92} ${x+16} ${y+90}H${x-2}Q${x-15} ${y+88} ${x-13} ${y+70}Z`;
  const base={A:'#d04a3a',B:'#3f8a52',C:'#dca63a',D:'#d04a3a'}[kind];
  let pat='';
  if(kind==='A')for(let k=y+16;k<y+96;k+=13)pat+=`<rect x="${x-16}" y="${k}" width="56" height="5" fill="#f8eedf"/>`;
  if(kind==='B'||kind==='D')for(let k=y+18,r=0;k<y+96;k+=11,r++)for(let j=x-12+(r%2?5:0);j<x+40;j+=11)pat+=`<circle cx="${j}" cy="${k}" r="2.6" fill="#f8eedf"/>`;
  if(kind==='C')for(let k=y+22;k<y+96;k+=16){let p='';for(let j=-16,u=0;j<44;j+=7,u++)p+=`${x+j},${k+(u%2?5:-5)} `;pat+=`<polyline points="${p}" fill="none" stroke="#8a3222" stroke-width="3"/>`}
  return `<clipPath id="sk${i}"><path d="${d}"/></clipPath><g clip-path="url(#sk${i})"><path d="${d}" fill="${base}"/>${pat}<rect x="${x-14}" y="${y}" width="28" height="13" fill="#f6eee0"/><rect x="${x-14}" y="${y+3}" width="28" height="2" fill="#dbd1bf"/><rect x="${x-14}" y="${y+8}" width="28" height="2" fill="#dbd1bf"/></g><path d="${d}" fill="none" stroke="#2a1d14" stroke-width="2"/><rect x="${x-4}" y="${y-8}" width="8" height="15" rx="2" fill="#c49560" stroke="#5a3a1f" stroke-width="1.5"/>`;

  const pipe=(d)=>`<path d="${d}" stroke="#1a1410" stroke-width="13" fill="none" stroke-linejoin="round" opacity=".35"/><path d="${d}" stroke="${CuD}" stroke-width="12" fill="none" stroke-linejoin="round"/><path d="${d}" stroke="${Cu}" stroke-width="8" fill="none" stroke-linejoin="round"/><path d="${d}" stroke="${CuL}" stroke-width="2.5" fill="none" stroke-linejoin="round" opacity=".8" transform="translate(-1.5 -1.5)"/>`;
  const halo=(d)=>`<path d="${d}" stroke="#2b2a33" stroke-width="18" fill="none" stroke-linejoin="round"/>`;
  const A='M300 395V330H560V250H400V172', B='M500 395V300H330V210H640V172', C='M700 395V360H430V280H720V230H520V172';
  const tapsX=[280,400,520,640,760], tapsN=[7,4,1,6,9];
  const header=`<path d="M250 168H790" stroke="${CuD}" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M250 168H790" stroke="${Cu}" stroke-width="9" fill="none" stroke-linecap="round"/><path d="M252 165H788" stroke="${CuL}" stroke-width="2.5" fill="none" opacity=".8"/>`;
  const tap=(x,n)=>`<rect x="${x-9}" y="150" width="18" height="24" rx="3" fill="${CuD}"/><rect x="${x-6}" y="153" width="12" height="18" rx="2" fill="${Cu}"/><circle cx="${x}" cy="142" r="9" fill="#e9b94c" stroke="#7a521a" stroke-width="1.5"/><rect x="${x-13}" y="139" width="26" height="6" rx="3" fill="#e9b94c" stroke="#7a521a" stroke-width="1"/><circle cx="${x}" cy="118" r="13" fill="#f6eedf" stroke="#3a2416" stroke-width="2"/><text x="${x}" y="119" font-family="Fredoka,sans-serif" font-size="16" font-weight="700" fill="#3a2a1c" text-anchor="middle" dominant-baseline="central">${n}</text>`;
  const barrel=(x,p)=>`${sp('barrel',x,458,118)}<circle cx="${x}" cy="398" r="15" fill="#f6eedf" stroke="#3a2416" stroke-width="2"/><g transform="translate(${x} 398) scale(1.15)">${PICT[p](0,0)}</g>`;
  const D1='M280 172V240H230V300', D2='M760 172V260H800V320';
  return `${bg('raum07')}
  ${header}${tapsX.map((x,i)=>tap(x,tapsN[i])).join('')}
  ${pipe(D1)}${pipe(D2)}<circle cx="230" cy="302" r="7" fill="${CuD}"/><circle cx="800" cy="322" r="7" fill="${CuD}"/>
  ${pipe(A)}${halo(B)}${pipe(B)}${halo(C)}${pipe(C)}
  ${barrel(300,'apfel')}${barrel(500,'birne')}${barrel(700,'kirsche')}
  ${sp('woodsign',560,100,210)}<text x="560" y="60" font-family="Caveat,cursive" font-size="16" font-weight="700" fill="#4a2e1a" text-anchor="middle">Welcher Hahn gehört</text><text x="560" y="80" font-family="Caveat,cursive" font-size="16" font-weight="700" fill="#4a2e1a" text-anchor="middle">zu welchem Fass?</text>
  ${lockImg(905,300,76,['apfel','birne','kirsche'],7)}`;
}

/* ---- Tag 9: Der Flur ---- */
function sceneFlur(){
  const G=[[6, 4, 5, 2, 0, 3], [0, 0, 0, 0, 0, 0], [2, 6, 0, 0, 5, 0], [0, 0, 0, 6, 3, 0], [0, 1, 0, 0, 0, 0], [0, 2, 0, 0, 4, 5]],dots={'1,2':'#c9372a','3,0':'#2e6fc0','4,5':'#e6b53a'};
  const X0=228,Y0=46,C=44;
  let panel=`<g filter="url(#ds)"><rect x="${X0-14}" y="${Y0-14}" width="${6*C+28}" height="${6*C+28}" rx="8" fill="#6c4528"/></g><rect x="${X0-6}" y="${Y0-6}" width="${6*C+12}" height="${6*C+12}" fill="#2d4a3a"/>`;
  for(let r=0;r<6;r++)for(let c=0;c<6;c++){const x=X0+c*C,y=Y0+r*C,v=G[r][c],d=dots[r+','+c];
    panel+=`<rect x="${x+1}" y="${y+1}" width="${C-2}" height="${C-2}" rx="3" fill="${(Math.floor(r/2)+Math.floor(c/3))%2?'#e8d9bd':'#f4ebd6'}"/>${v?`<text x="${x+C/2}" y="${y+C/2+1}" font-family="Fredoka,sans-serif" font-size="27" font-weight="700" fill="#3a2a1c" text-anchor="middle" dominant-baseline="central">${v}</text>`:''}${d?`<circle cx="${x+C/2}" cy="${y+C/2}" r="9" fill="${d}" stroke="#3a2416" stroke-width="2"/>`:''}`}
  panel+=`<path d="M${X0-6} ${Y0+2*C}H${X0+6*C+6}M${X0-6} ${Y0+4*C}H${X0+6*C+6}M${X0+3*C} ${Y0-6}V${Y0+6*C+6}" stroke="#6c4528" stroke-width="5"/>`;
  return `${bg('raum09')}
  ${panel}
  <text x="600" y="134" font-family="Caveat,cursive" font-size="17" font-weight="700" fill="#4a2e1a" text-anchor="middle">1 bis 6 –</text><text x="600" y="156" font-family="Caveat,cursive" font-size="17" font-weight="700" fill="#4a2e1a" text-anchor="middle">jede nur einmal!</text>
  ${lockImg(895,290,80,['dotR','dotB','dotG'],9)}`;
}

function sceneEisweiher(){
  // Von der Hütte aus gelesen: 1 2 6 4 9 – Pirouetten: 3 um die 1, 1 um die 6, 2 um die 9 → 6·9·1
  const digits=[['1',3],['2',0],['6',1],['4',0],['9',2]], step=96;
  const stroke=(d,w,c)=>`<path d="${d}" fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round"/>`;
  const track=(inner)=>`<g fill="none" stroke="#eaf6ff" stroke-width="7" stroke-linecap="round">${inner}</g><g fill="none" stroke="#7fb3d9" stroke-width="2.5" stroke-linecap="round">${inner}</g>`;
  const items=digits.map(([d,n],i)=>{const x=(i-2)*step;return `<text x="${x}" y="0" font-family="Caveat,cursive" font-size="118" font-weight="600" text-anchor="middle" dominant-baseline="central">${d}</text>${Array.from({length:n},(_,k)=>`<ellipse cx="${x}" cy="4" rx="${40+k*9}" ry="${58+k*9}" transform="rotate(${-8+k*6} ${x} 4)"/>`).join('')}`}).join('');
  return `${bg('raum19')}
  <g transform="translate(520 428) rotate(180) skewX(-8) scale(1 .5)" opacity=".85">${track(items)}</g>
  <g font-family="Caveat,cursive" font-weight="700" fill="#3a2410" text-anchor="middle"><text x="937" y="292" font-size="10">Von der Hütte</text><text x="937" y="303" font-size="10">aus lesen!</text><text x="937" y="315" font-size="9">Pirouetten =</text><text x="937" y="326" font-size="9">Stelle im Code</text></g>
  ${lockImg(755,258,50,['eis1','eis2','eis3'],7)}`;
}

const NONO={
  pats:[["####","#...","###.","...#","###."],["#..#","#..#","####","...#","...#"],[".##.","#..#",".###","...#",".##."]], // 5, 4, 9
  X:[305,412,519], Y:60, C:16, fill:{}

function nonoClues(line){const o=[];let n=0;for(const ch of line){if(ch==='#')n++;else{if(n)o.push(n);n=0}}if(n)o.push(n);return o.length?o:[0]}
function nonoSvg(k,interactive,L){
  const {pats}=NONO,X=L?[L.x,L.x,L.x]:NONO.X,Y=L?L.y:NONO.Y,C=L?L.C:NONO.C,p=pats[k],x0=X[k]+(L?60:30),y0=Y+(L?100:34),W=4,H=5;
  const rc=p.map(nonoClues), cc=Array.from({length:W},(_,c)=>nonoClues(p.map(r=>r[c]).join('')));
  const m=L?2:1, PW=W*C+40*m, PH=H*C+56*m;
  let s=`<g filter="url(#ds2)"><rect x="${X[k]}" y="${Y}" width="${PW}" height="${PH}" rx="3" fill="#f6efe0" stroke="#c9b48a" stroke-width="1.5"/></g><circle cx="${X[k]+PW/2}" cy="${Y+6*m}" r="${3.5*m}" fill="#c9372a"/>
  <text x="${X[k]+PW/2}" y="${Y+17*m}" font-family="Caveat,cursive" font-size="${14*m}" font-weight="700" fill="#3a2a1c" text-anchor="middle">Muster ${k+1}</text>`;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){const on=interactive&&NONO.fill[k+','+r+','+c];s+=`<rect class="nc" data-k="${k}" data-r="${r}" data-c="${c}" x="${x0+c*C}" y="${y0+r*C}" width="${C}" height="${C}" fill="${on?'#8a3b2a':'#fffaf0'}" stroke="#8a7a60" stroke-width=".8"/>`}
  s+=rc.map((cl,r)=>`<text x="${x0-4*m}" y="${y0+r*C+C/2+3.5*m}" font-family="Fredoka,sans-serif" font-size="${9.5*m}" font-weight="700" fill="#3a2a1c" text-anchor="end">${cl.join(' ')}</text>`).join('');
  s+=cc.map((cl,c)=>cl.map((v,i)=>`<text x="${x0+c*C+C/2}" y="${y0-4*m-(cl.length-1-i)*9*m}" font-family="Fredoka,sans-serif" font-size="${9.5*m}" font-weight="700" fill="#3a2a1c" text-anchor="middle">${v}</text>`).join('')).join('');
  return s;
}

          `Schreib die Waagen als Gleichungen: Herz = 2 Sterne + Kipferl, Herz + Stern = 11, Herz + Kipferl = Stern + 7. Drück Herz und Kipferl durch den Stern aus (Herz = 11 − Stern, Kipferl = 11 − 3 Sterne) und setz beides in die dritte Waage ein – dann bleibt nur noch der Stern übrig.`,
          `Herz 8, Stern 3, Kipferl 2 (Probe: 8 = 2·3 + 2, 8 + 3 = 11, 8 + 2 = 3 + 7). Auf der Scheibe: Stern · 8 · 3 · 2.`],
   spots:[
    {x:232,y:268,w:136,h:112,pad:4,t:'Erste Waage',c:'Die Waage ist im Gleichgewicht: ein Herz gegen zwei Sterne und ein Kipferl.',mark:[300,262]},
    {x:422,y:268,w:136,h:112,pad:4,t:'Zweite Waage',c:'Auch im Gleichgewicht: Herz und Stern gegen Walnüsse. Zählen musst du selbst.',mark:[490,262]},
    {x:632,y:268,w:136,h:112,pad:4,t:'Dritte Waage',c:'Ebenfalls im Gleichgewicht: Herz und Kipferl gegen einen Stern und Walnüsse.',mark:[700,262]},
    {x:812,y:85,w:185,h:385,t:'Das Speisekammer-Schloss',c:'Unter den drei Rädchen sind kleine Bilder eingeprägt.',mark:[905,92]},
    {x:5,y:40,w:200,h:330,t:'Der Ofen',c:'Noch warm. Hier ist nichts versteckt, ich hab nachgeschaut.',mark:[195,60]},
    {x:680,y:515,w:250,h:100,t:'Das Backbuch',c:'Seite 12. Da steht, wie man mit Waagen rechnet. Hab ich mir vom Postmeister erklären lassen.',mark:[690,510]}
   ]}
};
DAYS[4]={room:'Die Speisekammer', sym:3, fipsx:1, hash:'1pj4h79', scene:sceneSpeisekammer, fips:[300,612,.9],
   intro:`Die Speisekammer! Hier lagert mein ganzer Wintervorrat. Ich hab die Gläser nach meinem eigenen System beschriftet. Nur drei Gläser sind noch ohne Zahl – die hab ich mir für den Code aufgehoben.`,
   outro:`Das Schloss klackt. »Acht, drei, sechs«, nickt Fips, »das hätte ich wissen müssen.« Zwischen den Marmeladegläsern blinkt der vierte Sternsplitter.`,
   hints:[`Jedes Regalbrett folgt einer eigenen Regel. Lies die Zahlen von links nach rechts – das Glas mit dem Fragezeichen ist jeweils die Fortsetzung.`,
          `Oben: Jede Zahl ist die Summe der beiden davor. Mitte: Es geht in Zweierschritten bergab. Unten: Es geht abwechselnd zwei vor und eins zurück.`,
          `Oben 1,1,2,3,5 → 8. Mitte 9,7,5,?,1 → 3. Unten 1,3,2,4,3,5,4 → 6. Auf der Scheibe: Tanne · 8 · 3 · 6.`],
   spots:[
    {x:90,y:70,w:520,h:90,pad:4,t:'Das obere Regal',c:'Marmelade, Honig, Eingelegtes. Und ein leeres Glas.',mark:[620,80]},
    {x:70,y:190,w:540,h:90,pad:4,t:'Das mittlere Regal',c:'Hier wird es weniger.',mark:[620,200]},
    {x:50,y:310,w:560,h:90,pad:4,t:'Das untere Regal',c:'Mein Lieblingsregal. Da geht es immer hin und her.',mark:[620,318]},
    {x:595,y:250,w:165,h:100,t:'Das Schild',c:'Damit ich mein System nicht vergesse. Hat nicht geholfen.',mark:[760,260]},
    {x:800,y:85,w:195,h:390,t:'Die Kellertür',c:'Ein Tannenbaum ist eingeprägt. Unter den Rädchen drei Gläser mit Fragezeichen.',mark:[895,92]}
   ]};
DAYS[5]={room:'Die Werkstatt', sym:6, hash:'upmwqt', scene:sceneWerkstatt, fips:[300,612,.9],
   intro:`Meine Werkstatt. Hier hab ich letztes Jahr Würfel für die Rentiere geschnitzt. Drei liegen noch auf der Werkbank. Das Schloss zeigt auch Würfel … mit einem Pfeil nach unten.`,
   outro:`Klick! Fips dreht einen Würfel um und grinst: »Fünf. Natürlich.« Unter dem Würfel liegt der fünfte Sternsplitter.`,
   hints:[`Auf dem Schild steht es schon: Was unten liegt, zählt. Du siehst von jedem Würfel die Oberseite – gesucht ist die Seite, auf der er liegt.`,
          `Bei einem echten Würfel ergeben gegenüberliegende Seiten zusammen immer sieben.`,
          `Oben 2, 5, 3 → unten 5, 2, 4. Auf der Scheibe: Herz · 5 · 2 · 4.`],
   spots:[
    {x:240,y:200,w:520,h:150,pad:4,t:'Die Würfel auf der Werkbank',c:'Selbst geschnitzt. Richtige Würfel, mit allem, was dazugehört.',mark:[500,190]},
    {x:520,y:55,w:290,h:150,t:'Das Schild',c:'Das hab ich mir über die Werkbank gehängt. Für schwere Zeiten.',mark:[810,70]},
    {x:20,y:55,w:380,h:220,t:'Die Werkzeugwand',c:'Hammer, Säge, Hobel, Zange. Hier ist nichts versteckt, höchstens Staub.',mark:[395,60]},
    {x:815,y:85,w:180,h:380,t:'Die Werkstatttür',c:'Ein Herz ist eingeprägt. Unter den Rädchen: drei Würfel mit Pfeil nach unten.',mark:[905,92]}
   ]};
DAYS[6]={room:'Der Dachboden', sym:4, hash:'ykx02e', scene:sceneDachboden, fips:[165,612,.9],
   intro:`Der Dachboden. Staubig, aber ich hab hier alles verzeichnet – auf meiner Karte an der Wand. Die Wegbeschreibung zum Schlüssel hab ich mir aufgeschrieben. Nur mein Kompass hängt ein bisschen schief.`,
   outro:`»Vier, zwei, neun!« Fips klopft auf die Kiste. »Norden ist eben da, wo der Kompass hinzeigt.« Zwischen alten Wunschzetteln funkelt der sechste Sternsplitter.`,
   hints:[`Folge der Wegbeschreibung auf der Karte, Schritt für Schritt, und beginne bei der Luke. Aber schau genau, wohin der Kompass auf der Karte zeigt.`,
          `Norden ist auf dieser Karte links, Osten oben, Süden rechts, Westen unten. Jeder Schritt ist ein Kästchen.`,
          `Luke → 2 nach Norden (links) → 3 nach Osten (hoch) → Kiste 4 → 4 nach Süden (rechts) → Kiste 2 → 2 nach Westen (runter) → Kiste 9. Auf der Scheibe: Mond · 4 · 2 · 9.`],
   spots:[
    {x:416,y:86,w:250,h:260,t:'Die Karte vom Dachboden',c:'Alle Kisten mit Nummer. Die dunkle ist die Luke, durch die man hochkommt. Den Kompass hab ich extra dazugemalt.',mark:[400,96]},
    {note:true,x:242,y:408,w:62,h:56,t:'Die Wegbeschreibung',html:`<p>Start bei der Luke.</p><p>2 Schritte nach Norden.</p><p>3 nach Osten.</p><p>4 nach Süden.</p><p>2 nach Westen.</p><p>Die drei Kisten, bei denen du ankommst – in dieser Reihenfolge!</p>`,mark:[236,380]},
    {x:40,y:130,w:230,h:230,t:'Das Rundfenster',c:'Von hier sieht man den Mond. Und wenn man Glück hat, das Christkind.',mark:[292,140]},
    {x:800,y:150,w:195,h:330,t:'Die Dachbodentür',c:'Ein Mond ist eingeprägt. Unter den Rädchen: drei Kisten.',mark:[895,160]}
   ]};
DAYS[7]={room:'Der Keller', sym:7, hash:'1su0fac', scene:sceneKeller, fips:[120,612,.9],
   intro:`Brr, der Keller. Die Wäscherutsche vom Dachboden endet genau hier – praktisch. Hier lagert mein Saft: Apfel, Birne, Kirsche, drei Fässer, und von jedem führt eine Leitung zu einem der Zapfhähne oben an der Wand. Die Hähne haben Nummern. Welche zu welchem Fass gehört, verrät nur die Leitung.`,
   outro:`»Vier, sechs, eins!« Das Schloss springt auf, und Fips zapft sich an Hahn eins einen Becher Kirschsaft. Im Hahn klemmt der siebte Sternsplitter. »Die Treppe führt hinauf in die Schreibstube«, sagt er, »dort liegt der Brief vom Christkind.«`,
   hints:[`Jedes Fass hängt an einer Kupferleitung, die zu genau einem nummerierten Zapfhahn führt. Verfolge sie mit dem Finger, am besten in der Nahansicht.`,
          `Leitungen kreuzen sich, aber sie verbinden sich nie – an einer Kreuzung geht es immer geradeaus weiter. Zwei Hähne haben nur Sackgassen. Das Schloss will die Hahn-Nummern in der Reihenfolge Apfel, Birne, Kirsche.`,
          `Apfel → Hahn 4, Birne → Hahn 6, Kirsche → Hahn 1. Auf der Scheibe: Schlüssel · 4 · 6 · 1.`],
   spots:[
    {x:190,y:95,w:640,h:400,pad:4,t:'Fässer und Leitungen',c:'Drei Fässer, fünf Hähne, ein Rohrgewirr. Die Leitungen kreuzen sich, aber sie verbinden sich nie – darauf hab ich beim Löten geachtet.',mark:[200,96]},
    {x:470,y:40,w:180,h:70,t:'Das Schild',c:'Die Frage hab ich mir selbst hingehängt. Für genau so einen Tag.',mark:[650,48]},
    {x:130,y:120,w:110,h:160,t:'Die Kerze',c:'Ohne die sieht man hier unten gar nichts.',mark:[240,130]},
    {x:815,y:120,w:180,h:360,t:'Die Tür nach oben',c:'Ein Schlüssel ist eingeprägt. Unter den Rädchen: Apfel, Birne, Kirsche.',mark:[905,128]}
   ]};
DAYS[8]={room:'Die Schreibstube', sym:8, hash:'1sfiyh2', scene:sceneSchreibstube, fips:[700,612,.9],
   intro:`Die Schreibstube. Hier schreibe ich mit dem Christkind, und zwar in Wichtelziffern. Die Tabelle an der Wand ist leider nicht vollständig – drei Zeichen hab ich nie eingetragen. Aber im Brief vom Christkind kommen genau die vor: in dem Datum, bis zu dem ich oben sein soll.`,
   outro:`Klick! »Zwei, vier, eins … jetzt merk ich sie mir.« Fips trägt die drei Zeichen in die Tabelle ein. Im Tintenfass schimmert der achte Sternsplitter.`,
   hints:[`Das Schloss zeigt drei Wichtelziffern. Sieben davon stehen in der Tabelle, drei fehlen. Im Brief auf dem Pult nennt das Christkind einen Termin – in Wichtelziffern.`,
          `Bis wann soll Fips in der Himmelswerkstatt sein? Bis zum Heiligen Abend, also 24.12. – genau dieses Datum steht in Wichtelziffern im Brief, und darin stecken die drei fehlenden Zeichen.`,
          `24.12. ⇒ erstes Zeichen = 2, zweites = 4, drittes = 1. Das Schloss zeigt 4 · 1 · 2. Auf der Scheibe: Geschenk · 4 · 1 · 2.`],
   spots:[
    {x:50,y:60,w:420,h:220,t:'Die Wichtelziffern',c:'Mein Schlüssel für die Geheimschrift. Drei Zeichen fehlen, die hatte ich nie nötig. Bis jetzt.',mark:[476,70]},
    {note:true,x:340,y:220,w:130,h:150,t:'Der Brief vom Christkind',html:`<p>Lieber Fips,</p><p>heuer schaffe ich es nicht allein. Komm bis zum ${runeSvg(2)}${runeSvg(4)}.${runeSvg(1)}${runeSvg(2)}. in die Himmelswerkstatt.</p><p>Deine Freundin, das Christkind</p><p class="sig">Himmelswerkstatt, Ende November</p>`,mark:[480,252]},
    {x:480,y:40,w:320,h:320,t:'Das Bücherregal',c:'Rentierkunde, Schlittenbau, 1000 Kekse. Hier steht alles, was ein Wichtel wissen muss.',mark:[798,52]},
    {x:810,y:85,w:185,h:385,t:'Die Flurtür',c:'Ein Geschenk ist eingeprägt. Unter den Rädchen: drei Wichtelziffern.',mark:[905,92]}
   ]};
DAYS[9]={room:'Der Flur', sym:9, hash:'bhm4f1', scene:sceneFlur, fips:[360,612,.9],
   intro:`Der Flur! Fast draußen. Das Fliesenbild hat mein Großonkel gelegt, ein Rätselfreund wie ich. Jede Zahl von eins bis sechs genau einmal in jeder Reihe, jeder Spalte und jedem der sechs Blöcke – und drei Fliesen hat er mit Punkten markiert.`,
   outro:`Das letzte Schloss vor der Haustür ist offen! Fips atmet auf. Hinter der roten Fliese steckt der neunte Sternsplitter. »Und jetzt«, sagt Fips, »holen wir den Schlitten aus dem Schuppen – aber erst muss ich durchs Gartentor.«`,
   hints:[`Das Fliesenbild ist ein 6×6-Sudoku: 1 bis 6 in jeder Reihe, jeder Spalte und in jedem der sechs dick umrandeten 2×3-Blöcke. Das Schloss will die Zahlen unter dem roten, dem blauen und dem gelben Punkt.`,
          `Fang mit der ersten Reihe an: Dort fehlt nur eine Zahl. Danach hilft der mittlere linke Block weiter.`,
          `Rot (2. Reihe, 3. Spalte) = 2, Blau (4. Reihe, 1. Spalte) = 4, Gelb (5. Reihe, 6. Spalte) = 6. Auf der Scheibe: Kugel · 2 · 4 · 6.`],
   spots:[
    {x:210,y:30,w:310,h:300,t:'Das Fliesenbild',c:'Sechs mal sechs Fliesen. Mein Großonkel hat drei davon mit farbigen Punkten markiert.',mark:[548,48]},
    {x:535,y:100,w:135,h:80,t:'Das Schild',c:'Hab ich aufgehängt, als ich das Bild zum ersten Mal gelöst hab.',mark:[672,108]},
    {x:10,y:100,w:200,h:380,t:'Der Christbaum',c:'Noch vom letzten Jahr. Er hält sich erstaunlich.',mark:[205,110]},
    {x:800,y:85,w:195,h:385,t:'Die Haustür',c:'Eine Kugel ist eingeprägt. Unter den Rädchen: ein roter, ein blauer und ein gelber Punkt.',mark:[895,92]}
   ]};
Object.assign(DAYS,{
 10:{room:'Der Vorgarten', sym:0, hash:'128jo6l', scene:sceneVorgarten, fips:[150,614,.85],
   intro:`Draußen! Endlich frische Luft. Das Gartentor hat ein Schloss mit drei Zaunstücken drauf. Den Zaun hab ich im Herbst gestrichen – nicht zu Ende, nur ein paar Spitzen. Das hatte einen Grund, und der steht auf den Schildchen.`,
   outro:`Das Gartentor schwingt auf. »Vier, fünf, zwei«, nickt Fips. »Acht-vier-zwei-eins – der alte Wichteltrick.« Im Schnee neben dem Torpfosten funkelt der zehnte Sternsplitter. »Jetzt zum Holzschuppen – von dort geht's weiter zum Rentierstall!«`,
   hints:[`Am Zaun sind manche Lattenspitzen rot gestrichen. Die Latten stehen in drei Vierergruppen – jede Gruppe ergibt eine Ziffer, von links nach rechts I, II, III.`,
          `Das Schildchen über jeder Gruppe sagt, was die Latten wert sind: 8, 4, 2, 1 – von links nach rechts. Zähl nur die Werte der roten Spitzen zusammen.`,
          `Gruppe I: nur die 4er-Latte rot → 4. Gruppe II: 4 und 1 → 5. Gruppe III: nur die 2 → 2. Auf der Scheibe: Kerze · 4 · 5 · 2.`],
   spots:[
    {x:300,y:380,w:530,h:170,pad:4,t:'Der Zaun',c:'Im Herbst hab ich angefangen, die Latten zu streichen. Nur ein paar Spitzen – mit System.',mark:[300,372]},
    {x:800,y:395,w:135,h:150,pad:4,t:'Das Gartentor',c:'Eine Kerze ist eingeprägt. Unter den Rädchen drei Zaunstücke: I, II und III.',mark:[940,392]},
    {x:20,y:270,w:280,h:260,t:'Die Schneemänner',c:'Papa und Mini. Mama ist vorhin geschmolzen – die Sonne, sagt Papa.',mark:[290,276]},
    {x:280,y:60,w:460,h:360,t:'Mein Häuschen',c:'Von außen sieht es so friedlich aus. Von innen war es eine Falle.',mark:[520,70]}
   ]},
 11:{room:'Der Holzschuppen', sym:11, hash:'1dz1kg6', scene:sceneSchuppen, fips:[300,615,.8],
   intro:`Der Holzschuppen! Hier wohnt der Specht, der mir jeden Morgen Zahlen in die Bretter klopft – kurze und lange Kerben. Seine Sprache hab ich auf einen Zettel geschrieben, zumindest die Ziffern 1 bis 5; den Rest muss man umdrehen. Der Schlitten? Der steht beim Schmied zur Reparatur, fällt mir gerade ein. Aber durch die Schuppentür geht's zum Rentierstall.`,
   outro:`Klick! »Eins, drei, neun«, sagt Fips. »Der Specht hat recht.« In einem Astloch glitzert der elfte Sternsplitter. »Den Schlitten holen wir später beim Schmied. Jetzt hinüber in den Stall – die Rentiere warten!«`,
   hints:[`Die Kerben in den drei Brettern sind Spechtsprache: runde Löcher sind kurz, lange Rillen lang. Der Zettel zeigt, welche Folge von fünf Kerben welche Ziffer ist – für 1 bis 5. Lies jedes Brett von links nach rechts.`,
          `Für 6 bis 9 und 0 gilt: kurz und lang vertauschen. Aus 4 (kurz kurz kurz kurz lang) wird 9 (lang lang lang lang kurz).`,
          `Brett 1: kurz-lang-lang-lang-lang = 1. Brett 2: kurz-kurz-kurz-lang-lang = 3. Brett 3: lang-lang-lang-lang-kurz = 9. Auf der Scheibe: Stiefel · 1 · 3 · 9.`],
   spots:[
    {x:385,y:118,w:175,h:195,t:'Die Spechtsprache',c:'Kurze Kerbe, lange Kerbe – so zählt der Specht. 1 bis 5 hat er mir beigebracht. Für 6 bis 9 und 0 dreht man die Kerben einfach um: kurz wird lang, lang wird kurz.',mark:[395,130]},
    {x:540,y:160,w:200,h:200,t:'Die drei Bretter',c:'Da hat er geklopft: runde Löcher sind kurz, lange Rillen sind lang. Drei Bretter, drei Ziffern – von oben nach unten.',mark:[730,170]},
    {x:60,y:40,w:150,h:200,t:'Der Specht',c:'Guten Morgen, Specht. Nicht so laut bitte.',mark:[195,60]},
    {x:745,y:140,w:225,h:400,t:'Die Schuppentür',c:'Ein Stiefel ist eingeprägt. Unter den Rädchen: drei Klopfmuster.',mark:[760,160]}
   ]},
 12:{room:'Der Rentierstall', sym:10, hash:'14o0jd1', scene:sceneStall, fips:[580,615,.8],
   intro:`Der Rentierstall! Rudi, Lotte und Max schauen schon aus ihren Boxen. Das Schloss an der Stalltür will ihr Alter wissen – und ich Schussel hab mir das nur als Rätsel an die Tafel geschrieben.`,
   outro:`Das Schloss klackt, Rudi schnaubt zufrieden. »Acht, fünf, drei. Ihr werdet auch nicht jünger.« Im Heu liegt der zwölfte Sternsplitter. »Die Rentiere brauchen Proviant für die Reise. Auf zum Dorfplatz, einkaufen!«`,
   hints:[`Die Tafel verrät das Alter der drei Rentiere. Das Schloss will es in der Reihenfolge Rudi, Lotte, Max – erkennbar am Geweih: groß, mittel, klein.`,
          `Rudi + Lotte = 13 und Rudi − Lotte = 3. Zwei Zahlen, die sich um 3 unterscheiden und 13 ergeben.`,
          `Rudi 8, Lotte 5, Max = 8 − 5 = 3. Auf der Scheibe: Zuckerstange · 8 · 5 · 3.`],
   spots:[
    {x:100,y:90,w:680,h:340,t:'Die drei Rentiere',c:'Rudi mit dem großen Geweih, Lotte mit dem mittleren, und Max, der Kleine.',mark:[360,250]},
    {x:660,y:0,w:290,h:140,t:'Die Stalltafel',c:'Mein Altersrätsel. Lotte findet es nicht lustig.',mark:[670,130]},
    {x:835,y:175,w:165,h:440,t:'Die Stalltür',c:'Eine Zuckerstange ist eingeprägt. Unter den Rädchen: großes Geweih, mittleres Geweih, kleines Geweih.',mark:[860,470]}
   ]},
 13:{room:'Der Dorfplatz', sym:1, hash:'1p0si5v', scene:sceneDorfplatz, fips:[660,615,.85],
   intro:`Der Dorfplatz! Vier Häuser, ein Brunnen, und hinter dem Rathaus-Durchgang liegt die Bäckergasse. Das Tor zum Durchgang ist verschlossen. Wer in welchem Haus wohnt, steht am Rathaus-Anschlag – aber nur um drei Ecken.`,
   outro:`Das Tor springt auf. »Bäcker neun, Schmied sieben, Schneiderin fünf.« Fips winkt zum Fenster des Lehrers. Im Brunnen glitzert der dreizehnte Sternsplitter. »Und jetzt durch den Durchgang – zur Bäckerei von Frau Krümel!«`,
   hints:[`Vier Häuser mit Nummern und Türfarben. Der Anschlag sagt, wer wo wohnt. Das Schloss will die Hausnummern von Bäcker, Schmied und Schneiderin.`,
          `Der Schmied hat die grüne Tür. Die Schneiderin wohnt direkt links davon. Der Lehrer ganz links – dann bleibt für den Bäcker nur noch ein Rand.`,
          `Lehrer 2, Schneiderin 5, Schmied 7, Bäcker 9. Auf der Scheibe: Glocke · 9 · 7 · 5.`],
   spots:[
    {x:30,y:200,w:790,h:210,t:'Die vier Häuser',c:'Von links: Hausnummer 2, 5, 7 und 9. Rote, blaue, grüne und gelbe Tür.',mark:[440,210]},
    {x:862,y:130,w:125,h:80,t:'Der Rathaus-Anschlag',c:'Fünf Zeilen. Mehr braucht ein Dorf nicht.',mark:[865,120]},
    {x:290,y:300,w:320,h:290,t:'Der Dorfbrunnen',c:'Zugefroren, mit Baum. So macht man das hier.',mark:[300,580]},
    {x:865,y:275,w:135,h:185,t:'Der Rathaus-Durchgang',c:'Dahinter liegt die Bäckergasse. Eine Glocke ist eingeprägt. Unter den Rädchen: Brezel, Hammer, Schere.',mark:[875,290]}
   ]},
 14:{room:'Die Dorfbäckerei', sym:2, hash:'s5rdwg', scene:sceneBaeckerei, fips:[760,615,.8],
   intro:`Die Dorfbäckerei von Frau Krümel. Es duftet herrlich! Die Hintertür führt weiter zum Postamt, aber Frau Krümel hat ein Zahlenschloss davor. »Die Zahlen stehen an der Tafel«, sagt sie. »Alle fünfundzwanzig. Die Schablone liegt bei der Theke – und richtig liegt sie nur auf eine Art.«`,
   outro:`Klick! »Sechs, fünf, neun – und ein Kipferl auf die Hand.« Frau Krümel hat den vierzehnten Sternsplitter im Mehl gefunden. »Jetzt zum Postamt, meinen Brief ans Christkind aufgeben!«`,
   hints:[`Die Lochschablone neben der Theke gehört auf die Zahlentafel. Dort kannst du sie auflegen, drehen und wenden. Die Karte sagt, wann sie richtig liegt.`,
          `Richtig liegt die Schablone, wenn die drei Zahlen in den Löchern zusammen 20 ergeben. Probier alle vier Drehungen – mit der Vorderseite und mit der Rückseite nach vorn. Nur eine Lage passt.`,
          `Vorderseite, Pfeil nach links: 6 + 5 + 9 = 20. Loch 1 = 6, Loch 2 = 5, Loch 3 = 9. Auf der Scheibe: Stern · 6 · 5 · 9.`],
   spots:[
    {x:165,y:60,w:260,h:195,pad:6,t:'Die Zahlentafel',c:'Fünfundzwanzig Zahlen. Frau Krümel sagt, nur drei davon zählen – und ohne Schablone findet man sie nie. Auflegen, drehen, wenden – bis es stimmt.',mark:[410,70],
     zoom:()=>`<g id="stz" style="display:none">${stencilSvg(0,false)}</g>`,
     after:`<div class="row" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px"><button class="btn" id="stOn">Schablone auflegen</button><button class="btn ghost" id="stL" aria-label="Schablone nach links drehen">↺ drehen</button><button class="btn ghost" id="stR" aria-label="Schablone nach rechts drehen">↻ drehen</button><button class="btn ghost" id="stF" aria-label="Schablone wenden">⇋ wenden</button></div>`,
     init:()=>{let on=false,k=0,fl=false;const g=$('#stz'),b=$('#stOn');const draw=()=>{g.innerHTML=stencilSvg(k,fl);g.style.display=on?'':'none';b.textContent=on?'Schablone abnehmen':'Schablone auflegen'};b.onclick=()=>{on=!on;draw()};$('#stL').onclick=()=>{k=(k+3)%4;on=true;draw()};$('#stR').onclick=()=>{k=(k+1)%4;on=true;draw()};$('#stF').onclick=()=>{fl=!fl;on=true;draw()}}},
    {x:143,y:285,w:108,h:105,t:'Die Lochschablone',c:'Drei Löcher, ein Pfeil – und die Regel von Frau Krümel: Richtig liegt sie, wenn die drei Zahlen in den Löchern zusammen zwanzig ergeben.',mark:[245,290]},
    {x:220,y:300,w:440,h:290,t:'Die Vitrine',c:'Noch leer – Frau Krümel räumt erst ein, wenn ich draußen bin. Sagt sie.',mark:[240,560]},
    {x:830,y:120,w:160,h:490,t:'Die Hintertür',c:'Ein Stern ist eingeprägt. Unter den Rädchen: die Löcher 1, 2 und 3.',mark:[850,140]}
   ]},
 15:{room:'Das Postamt', sym:5, hash:'1wck2mq', scene:scenePostamt, fips:[470,615,.8],
   intro:`Das Postamt! Hier gehen alle Wunschzettel durch – auch meiner ans Christkind. Auf dem Schalter liegt ein Markenbogen, aus dem sechs Marken fehlen. Drei davon hat der Postmeister rot nummeriert – genau deren Werte will das Schloss an der Tür zur Gasse.`,
   outro:`Das Schloss klackt. »Vier, eins, sieben – ein magisches Quadrat, sogar ein doppeltes!« Zwischen zwei Wunschzetteln steckt der fünfzehnte Sternsplitter. »Hörst du? Es läutet. Zum Glockenturm – der Mesner wartet schon.«`,
   hints:[`Der Markenbogen ist ein magisches Quadrat: Jede Reihe, jede Spalte und beide Diagonalen ergeben 34. Fang mit Reihen oder Spalten an, in denen nur eine Marke fehlt.`,
          `Reihe 2 und Reihe 3 geben die mittleren Marken direkt (10 und 7). Für die Ecken brauchst du die Diagonalen: 16 + 10 + 7 + ? = 34 verbindet die Ecken links oben und rechts unten – kombiniere das mit der untersten Reihe und der ersten Spalte.`,
          `Links unten 4, rechts unten 1, Mitte 7 (die Ecke oben links ist 16, oben rechts 13, die Mitte oben 10). Auf der Scheibe: Schneeflocke · 4 · 1 · 7.`],
   spots:[
    {x:422,y:55,w:225,h:225,t:'Der Markenbogen',c:'Sechs Marken sind schon abgerissen. Die Werte stehen trotzdem fest – man muss nur rechnen. Das Schloss will die drei mit roter Nummer.',mark:[660,60]},
    {x:625,y:70,w:205,h:95,t:'Der Hinweis des Postmeisters',c:'Der Postmeister liebt Zahlen. Mehr als Briefe, ehrlich gesagt. Vierunddreißig, überall vierunddreißig.',mark:[640,165]},
    {x:170,y:50,w:280,h:300,t:'Die Postfächer',c:'Alle voll. Es ist Dezember.',mark:[440,70]},
    {x:845,y:140,w:150,h:430,t:'Die Tür zur Gasse',c:'Eine Schneeflocke ist eingeprägt. Unter den Rädchen: drei Briefmarken mit Fragezeichen.',mark:[860,160]}
   ]},
 16:{room:'Der Glockenturm', sym:3, hash:'ph4sv5', scene:sceneGlockenturm, fips:[250,615,.8],
   intro:`Der Glockenturm! Sieben Glocken, eine für jeden Ton – aber auf den Glocken stehen nur Zahlen, keine Namen. Der Mesner hat die Melodie fürs Abendläuten aufs Notenpult gelegt und drei Töne markiert. Die Turmtür führt hinunter zum Weihnachtsmarkt.`,
   outro:`Drei Glocken, dann ein Klick. »E, C, G – eins, vier, neun. Man muss sie nur der Größe nach anschauen.« Im Klöppel der großen Glocke hängt der sechzehnte Sternsplitter. »Und jetzt hinunter auf den Weihnachtsmarkt – Proviant für die Rentiere!«`,
   hints:[`Die eingekreisten Töne sind E, C und G. Auf den Glocken stehen aber nur Zahlen. Das Notenblatt verrät den Schlüssel: Die größte Glocke ist das tiefe C, jede nächsthöhere (D, E, F, G, A, H) ist ein Stück kleiner.`,
          `Ordne die sieben Glocken nach Größe: Die größte ist C, die drittgrößte E, die fünftgrößte G. Lies die Zahlen auf genau diesen drei Glocken, in der Reihenfolge E, C, G.`,
          `E = die drittgrößte Glocke mit der 1, C = die größte mit der 4, G = die fünftgrößte mit der 9. Auf der Scheibe: Tanne · 1 · 4 · 9.`],
   spots:[
    {x:180,y:95,w:650,h:150,t:'Die sieben Glocken',c:'Sieben Glocken, sieben Zahlen – aber keine Namen. Mein Vater hat sie gegossen, jede ein Stück kleiner als die nächsttiefere.',mark:[830,100]},
    {x:335,y:296,w:200,h:120,pad:4,t:'Das Notenblatt',c:'Das Abendläuten. Der Mesner hat drei Töne eingekreist – und dazugeschrieben, wie man die Glocken auseinanderhält.',mark:[540,310]},
    {x:560,y:170,w:230,h:260,t:'Das Turmfenster',c:'Von hier sieht man das ganze Dorf. Und den Markt, wo es morgen hingeht.',mark:[780,420]},
    {x:825,y:190,w:160,h:380,t:'Die Turmtür',c:'Ein Tannenbaum ist eingeprägt. Unter den Rädchen: Noten mit einem, zwei und drei Punkten.',mark:[840,210]}
   ]},
 17:{room:'Der Weihnachtsmarkt', sym:6, hash:'1dijomi', scene:sceneMarkt, fips:[470,615,.8],
   intro:`Der Weihnachtsmarkt! Bezahlt wird hier in Nüssen, und jeder Stand hat sein eigenes Tauschschild – manche rechnen ziemlich krumm. Am Ende des Markts steht die Hütte des Schmieds, und ihr Schloss will wissen, was Apfel, Kürbis und Käse in Nüssen kosten.`,
   outro:`Klick! »Apfel drei, Kürbis fünf, Käse neun Nüsse.« Fips kauft sich für den Rest einen Lebkuchen. Der siebzehnte Sternsplitter lag unter dem Käse. »Jetzt zum Schmied – der Schlitten braucht neue Kufen.«`,
   hints:[`Jedes Standschild ist eine Tauschgleichung. Alles wird in Nüssen gerechnet: Fang beim Nussstand an – drei Nüsse für einen Apfel.`,
          `Apfel = 3 Nüsse. Kürbisstand: Zwei Kürbisse = drei Äpfel + eine Nuss = 9 + 1 = 10 Nüsse, also ein Kürbis = 5. Käsestand: Käse + eine Nuss = zwei Kürbisse = 10 Nüsse, also Käse = 9.`,
          `Apfel 3, Kürbis 5, Käse 9. Auf der Scheibe: Herz · 3 · 5 · 9.`],
   spots:[
    {x:40,y:180,w:215,h:170,t:'Der Nussstand',c:'Drei Nüsse für einen Apfel. Fairer Kurs, sagt die Nussfrau.',mark:[255,190]},
    {x:300,y:180,w:200,h:170,t:'Der Kürbisstand',c:'Zwei Kürbisse gegen drei Äpfel und eine Nuss. Der Kürbismann rechnet gern krumm.',mark:[500,190]},
    {x:530,y:180,w:195,h:170,t:'Der Käsestand',c:'Ein Käse und eine Nuss gegen zwei Kürbisse. Der Käse ist es wert.',mark:[725,190]},
    {x:855,y:330,w:125,h:80,t:'Die Marktregel',c:'Alles in Nüssen. Seit hundert Jahren. Das Schloss will wissen, was Apfel, Kürbis und Käse in Nüssen kosten.',mark:[860,320]},
    {x:760,y:205,w:100,h:200,pad:10,t:'Das Markttor',c:'Durch die Hütte geht es weiter zur Schmiede. Ein Herz ist eingeprägt. Unter den Rädchen: Apfel, Kürbis, Käse.',mark:[770,195]}
   ]},
 18:{room:'Die Schlittenwerkstatt', sym:4, hash:'1ij3blw', scene:sceneSchlitten, fips:[810,615,.8],
   intro:`Die Schlittenwerkstatt vom alten Schmied. Mein Schlitten steht schon auf dem Bock! Drei Zahnradpaare hängen an der Wand – und das Schloss der Werkstatttür fragt, wie oft sich das kleine Rad dreht, wenn das große eine Runde macht.`,
   outro:`Klick! »Drei, fünf, zwei. Zahnräder lügen nicht.« Hinter dem großen Rad liegt der achtzehnte Sternsplitter. »Der Schmied sagt, der kürzeste Weg zum Berg führt über den Eisweiher. Na dann.«`,
   hints:[`Die Zahlen auf den Rädern sind die Zähne. Dreht sich das große Rad einmal, läuft jeder seiner Zähne am kleinen Rad vorbei.`,
          `Teile die Zähne des großen Rads durch die des kleinen: 24 durch 8 …`,
          `24/8 = 3, 20/4 = 5, 18/9 = 2. Auf der Scheibe: Mond · 3 · 5 · 2.`],
   spots:[
    {x:300,y:120,w:170,h:145,t:'Das erste Räderpaar',c:'24 Zähne und 8 Zähne.',mark:[310,265]},
    {x:475,y:105,w:160,h:140,t:'Das zweite Räderpaar',c:'20 Zähne und 4 Zähne.',mark:[480,245]},
    {x:628,y:110,w:160,h:140,t:'Das dritte Räderpaar',c:'18 Zähne und 9 Zähne.',mark:[640,250]},
    {x:320,y:485,w:355,h:110,t:'Das Schild',c:'Die Frage des Schmieds. Er mag es, wenn man nachdenkt.',mark:[330,595]},
    {x:350,y:250,w:420,h:220,t:'Der Schlitten',c:'Frisch lackiert. Die Kufen hat der Schmied heute Früh geschliffen.',mark:[360,460]},
    {x:785,y:55,w:210,h:420,t:'Die Werkstatttür',c:'Ein Mond ist eingeprägt. Unter den Rädchen: Zahnräder mit einem, zwei und drei Punkten.',mark:[800,70]}
   ]},
 19:{room:'Der Eisweiher', sym:7, hash:'1zwozw', scene:sceneEisweiher, fips:[800,615,.8],
   intro:`Der Eisweiher! Der Eismeister hat Zahlen ins Eis gelaufen – fünf Stück, und um manche hat er Pirouetten gedreht. Von hier sieht man alles nur falsch herum; das Schild sagt, man soll es von der Hütte aus lesen. Hinter der Eislaufhütte beginnt der Bergpfad.`,
   outro:`Klick! »Sechs, neun, eins. Eine Pirouette, zwei, drei – von der Hütte aus ist alles ganz einfach.« Im Schlittschuh steckt der neunzehnte Sternsplitter. »Und jetzt den Bergpfad hinauf. Oben wartet die Berghütte – und hoffentlich Kakao.«`,
   hints:[`Von der Hütte aus lesen heißt: auf dem Kopf. Fünf Ziffern stehen im Eis, aber nur drei davon sind von Pirouetten-Kreisen umgeben – die anderen zählen nicht.`,
          `Die Zahl der Kreise sagt die Stelle im Code: ein Kreis = erste Ziffer, zwei Kreise = zweite, drei Kreise = dritte.`,
          `Ein Kreis um die 6, zwei um die 9, drei um die 1. Auf der Scheibe: Schlüssel · 6 · 9 · 1.`],
   spots:[
    {x:270,y:330,w:500,h:180,t:'Die Spuren im Eis',c:'Fünf Zahlen und ein paar Pirouetten. Der Eismeister war fleißig. Oder ist oft hingefallen.',mark:[280,320]},
    {x:690,y:160,w:130,h:195,pad:10,t:'Die Hüttentür',c:'Die Eislaufhütte – dahinter beginnt der Bergpfad. Ein Schlüssel ist eingeprägt. Unter den Rädchen: drei Schlittschuhe.',mark:[700,150]},
    {x:880,y:265,w:115,h:100,t:'Das Schild',c:'Der Hinweis des Eismeisters: von der Hütte aus lesen. Und so viele Pirouetten, wie er um eine Zahl gedreht hat, so weit hinten steht sie im Code.',mark:[890,255]},
    {x:30,y:480,w:200,h:140,t:'Die Schlittschuhe',c:'Meine. Größe Wichtel. Ich war das aber nicht mit den Zahlen.',mark:[230,490]}
   ]},
 20:{room:'Die Berghütte', sym:8, hash:'1arrh6d', scene:sceneBerghuette, fips:[780,615,.8],
   intro:`Die Berghütte! Endlich warm. Die Wirtin strickt den ganzen Winter, und das Schloss der Hüttentür hat sie mit drei Strickmustern gesichert. »Jedes Muster ergibt eine Ziffer«, sagt sie. »Wer stricken kann, kann auch rätseln.«`,
   outro:`Klick! »Fünf, vier, neun – in Maschen gestrickt.« Die Wirtin schenkt Kakao ein. Der zwanzigste Sternsplitter lag in der Teekanne. »Von hier ist es nicht mehr weit bis zur Sternwarte. Der Sternwart erwartet mich.«`,
   hints:[`Die drei Strickmuster sind Rätsel: Die Randzahlen sagen, wie viele Maschen am Stück gefüllt sind – in jeder Reihe und jeder Spalte. Zwischen zwei Gruppen bleibt mindestens eine Masche frei. Du kannst die Kästchen direkt antippen.`,
          `Fang mit den vollen Reihen an: Eine 4 in einer Reihe mit vier Kästchen füllt alle. Eine Spalte mit »1 1 1« hat drei einzelne Maschen mit Lücken dazwischen. Die gefüllten Maschen ergeben eine Ziffer.`,
          `Muster 1 ergibt eine 5, Muster 2 eine 4, Muster 3 eine 9. Auf der Scheibe: Geschenk · 5 · 4 · 9.`],
   spots:[
    {x:295,y:50,w:340,h:160,pad:6,t:'Die Strickmuster',c:'Drei Muster der Wirtin. Tipp auf die Kästchen, um Maschen zu füllen – jedes Muster ergibt eine Ziffer.',mark:[250,90],
     vb:'0 0 300 356',zsvg:()=>`<rect width="300" height="356" fill="#5a3a22"/><g id="nz">${nonoSvg(NONO.cur||0,true,{x:30,y:20,C:40})}</g>`,
     after:`<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:10px 0 4px">${[0,1,2].map(k=>`<button class="btn ${k===(NONO.cur||0)?'':'ghost'}" data-nk="${k}">Muster ${k+1}</button>`).join('')}<button class="btn ghost" id="nzClear">Löschen</button></div>`,
     init:()=>{const g=$('#nz');const draw=()=>{g.innerHTML=nonoSvg(NONO.cur||0,true,{x:30,y:20,C:40});document.querySelectorAll('[data-nk]').forEach(b=>b.classList.toggle('ghost',+b.dataset.nk!==(NONO.cur||0)))};g.addEventListener('click',e=>{const t=e.target.closest('.nc');if(!t)return;const key=t.dataset.k+','+t.dataset.r+','+t.dataset.c;NONO.fill[key]=!NONO.fill[key];draw()});document.querySelectorAll('[data-nk]').forEach(b=>b.onclick=()=>{NONO.cur=+b.dataset.nk;draw()});$('#nzClear').onclick=()=>{const k=NONO.cur||0;Object.keys(NONO.fill).forEach(x=>{if(x.startsWith(k+','))delete NONO.fill[x]});draw()}}},
    {x:375,y:200,w:180,h:105,t:'Die Strickregel',c:'So liest man ein Strickmuster, sagt die Wirtin. Ich nicke dann immer.',mark:[560,205]},
    {x:370,y:320,w:360,h:220,t:'Der Tisch',c:'Tee, Kakao, eine Kerze. Die Wirtin sagt, zuerst das Rätsel, dann der Kakao.',mark:[730,330]},
    {x:825,y:110,w:170,h:420,t:'Die Hüttentür',c:'Ein Geschenk ist eingeprägt. Unter den Rädchen: Muster 1, 2 und 3.',mark:[840,120]}
   ]},
 21:{room:'Die Sternwarte', sym:9, hash:'tgoene', scene:sceneSternwarte, fips:[380,615,.8],
   intro:`Die Sternwarte! Durchs große Fenster sieht man drei Sternbilder – und ein paar Sterne, die zu keinem gehören. Der Sternwart zählt anders als andere Leute, steht auf seinem Schild. Die Kuppeltür führt hinaus auf die Wolkentreppe.`,
   outro:`Klick! »Vier, zwei, sieben – Linien, nicht Sterne.« Fips schaut noch kurz durchs Fernrohr. Der einundzwanzigste Sternsplitter blinkt auf dem Okular. »Dort oben, siehst du? Die Wolkentreppe. Da müssen wir rauf.«`,
   hints:[`Zähl in jedem Sternbild nicht die Sterne, sondern die Verbindungslinien dazwischen. Die Sternkarte auf dem Tisch verrät die Reihenfolge: Kassiopeia, Oriongürtel, Großer Wagen.`,
          `Kassiopeia ist ein W aus fünf Sternen – wie viele Striche hat ein W? Der Oriongürtel ist eine Linie aus drei Sternen. Beim Großen Wagen hat der Kasten vier Linien und die Deichsel drei.`,
          `Kassiopeia 4 Linien, Oriongürtel 2, Großer Wagen 7. Auf der Scheibe: Kugel · 4 · 2 · 7.`],
   spots:[
    {x:160,y:100,w:345,h:215,t:'Das Sternenfenster',c:'Mein Lieblingsplatz. Die verbundenen Sterne gehören zu den Bildern – die anderen sind einfach nur Sterne.',mark:[495,105]},
    {x:595,y:140,w:190,h:110,t:'Das Schild des Sternwarts',c:'Er zählt gern. Nur anders als andere.',mark:[600,130]},
    {x:135,y:405,w:140,h:70,t:'Die Sternkarte',c:'Die Reihenfolge fürs Schloss: Kassiopeia, Oriongürtel, Großer Wagen.',mark:[270,400]},
    {x:430,y:210,w:220,h:340,t:'Das Fernrohr',c:'Da darf ich durchschauen. Aber nur mit sauberen Händen.',mark:[640,330]},
    {x:815,y:140,w:180,h:430,t:'Die Kuppeltür',c:'Eine Kugel ist eingeprägt. Unter den Rädchen: drei kleine Sternbilder.',mark:[830,150]}
   ]},
 22:{room:'Die Wolkentreppe', sym:10, hash:'aha3vy', scene:sceneWolkentreppe, fips:[470,615,.8],
   intro:`Die Wolkentreppe! Von hier geht es hinauf zum Himmelstor. Drei kleine Treppen aus Wolken, und das Wolkentor will wissen, wie viele Wege es jeweils nach oben gibt – wenn ich immer eine oder zwei Stufen auf einmal nehme.`,
   outro:`Klick! »Fünf, acht, drei. Treppen sind spannender, als man denkt.« Auf der obersten Stufe liegt der zweiundzwanzigste Sternsplitter. »Hinter dem Wolkentor liegt der Vorhof des Himmelstors. Fast geschafft!«`,
   hints:[`Für jede Treppe: Wie viele verschiedene Folgen aus Einer- und Zweierschritten führen genau nach oben? Fang mit kleinen Treppen an.`,
          `1 Stufe: 1 Weg. 2 Stufen: 2 Wege (1+1, 2). 3 Stufen: 3 Wege. Jede weitere Treppe hat so viele Wege wie die beiden davor zusammen.`,
          `4 Stufen: 5 Wege, 5 Stufen: 8, 3 Stufen: 3. Auf der Scheibe: Zuckerstange · 5 · 8 · 3.`],
   spots:[
    {x:25,y:300,w:250,h:170,t:'Die Vierertreppe',c:'Vier Stufen. Eins oder zwei auf einmal.',mark:[35,290]},
    {x:285,y:280,w:290,h:190,t:'Die Fünfertreppe',c:'Fünf Stufen. Da gibt es schon einige Möglichkeiten.',mark:[295,270]},
    {x:550,y:325,w:200,h:145,t:'Die Dreiertreppe',c:'Drei Stufen. Die ist zum Warmwerden.',mark:[560,315]},
    {x:115,y:30,w:375,h:210,t:'Das Wolkenschild',c:'Die Regel. Wer springt, fliegt raus.',mark:[470,55]},
    {x:735,y:100,w:260,h:330,t:'Das Wolkentor',c:'Eine Zuckerstange ist eingeprägt. Unter den Rädchen: drei Treppen mit 4, 5 und 3 Stufen.',mark:[745,90]}
   ]},
 23:{room:'Der Vorhof des Himmelstors', sym:11, hash:'1y90jnq', scene:sceneVorhof, fips:[740,615,.8],
   intro:`Der Vorhof! Dahinter liegt die Himmelswerkstatt. Das große Tor hat drei Schlösser – eckig, rund, spitz – und am Schlüsselbrett hängen neun Schlüssel. Nur einer passt in jedes Schloss. Die Nummern der drei richtigen will das Zahlenschloss wissen.`,
   outro:`Drei Schlüssel, drei Klicks. »Sieben, zwei, neun.« Das Tor knarrt auf. Fips hält den dreiundzwanzigsten Sternsplitter in der Hand – morgen fehlt nur noch einer. »Morgen stehen wir vor der Himmelswerkstatt, {name}. Ich kann kaum schlafen.«`,
   hints:[`Jedes Schlüsselloch zeigt den Schlüsselbart, der hineinpasst: drei Zacken, von oben nach unten. Such den Schlüssel mit genau demselben Zackenmuster. Das Zahlenschloss will die Schlüsselnummern in der Reihenfolge eckig, rund, spitz.`,
          `Jedes Schlüsselloch zeigt einen Schlüsselbart mit drei Zacken, von oben nach unten. Das eckige Schloss hat das Muster lang-kurz-mittel. Such den Schlüssel am Brett mit genau diesen Zacken.`,
          `Eckig = Schlüssel 7, rund = Schlüssel 2, spitz = Schlüssel 9. Auf der Scheibe: Stiefel · 7 · 2 · 9.`],
   spots:[
    {x:440,y:120,w:120,h:390,pad:6,t:'Das Himmelstor',c:'Drei Schlösser in der goldenen Leiste: eckig, rund, spitz. Jedes mit eigenem Profil. Und darunter das Zahlenschloss.',mark:[445,110]},
    {x:30,y:230,w:215,h:260,t:'Das Schlüsselbrett',c:'Neun Schlüssel, neun Bärte. Einer sieht aus wie der andere – fast.',mark:[250,240]},
    {x:866,y:385,w:80,h:100,t:'Das Schild',c:'Der Türhüter meint es ernst.',mark:[860,375]},
    {x:850,y:190,w:110,h:170,t:'Die Laterne',c:'Die brennt seit immer. Sagt der Türhüter.',mark:[845,180]}
   ]}
});
DAYS[24]={room:'Die Himmelswerkstatt', final:true, hash:'1fbg7ax', scene:()=>sceneHimmel(!!S.solved[24]), fips:[225,615,.8],
   intro:`Das Himmelstor! Dahinter wartet das Christkind. Vierundzwanzig Sternsplitter hast du mit mir gesammelt – jeder trägt einen Buchstaben. Richtig geordnet ergeben sie das Losungswort. Sprich es aus, dann öffnet sich das Tor!`,
   outro:`Das Tor steht offen. Das Christkind lächelt. »Danke, {name}. Ohne dich wäre Fips noch immer in seiner Kammer.« Und Fips? Der schläft zum ersten Mal seit Wochen – diesmal mit offener Tür.`,
   hints:[`Die 24 Buchstaben sind durcheinander. Zusammen ergeben sie einen Weihnachtswunsch aus vier Wörtern. Umlaute sind als UE geschrieben.`,
          `Der Wunsch beginnt mit »FROHE«. Danach kommt das, was man sich zu dieser Zeit wünscht – und am Ende steht, für wen er gilt.`,
          `Das Losungswort lautet: FROHE WEIHNACHTEN FUER DICH.`],
   spots:[]};
const DAYCOUNT = 24;
const hasContent = n => !!DAYS[n];

/* =========================================================
   DATUM & FREISCHALTUNG
   ========================================================= */
const now = () => new Date();
const openDate = n => new Date(YEAR,11,n,0,0,0);
const beforeStart = () => now() < openDate(1);
function dayState(n){
  if(S.solved[n]) return 'done';
  if(!hasContent(n)) return PREVIEW ? 'soon' : (now()>=openDate(n) ? 'soon' : 'wait');
  if(!PREVIEW && now() < openDate(n)) return 'wait';
  if(n>1 && !S.solved[n-1] && !PREVIEW) return 'blocked';
  return 'open';
}

/* =========================================================
   SCREENS
   ========================================================= */
const app = $('#app');
const nameOf = () => esc(S.name || 'du');
const fill = s => s.replace(/\{name\}/g, nameOf());

function fir(x,base,h,snow=true){
  const w=h*.5;let s=`<rect x="${x-h*.04}" y="${base-h*.08}" width="${h*.08}" height="${h*.16}" fill="#3d2816"/>`;
  for(let k=0;k<3;k++){const y=base-k*h*.3,ww=w*(1-k*.22),hh=h*.5;
    s+=`<path d="M${x-ww} ${y}Q${x-ww*.55} ${y-hh*.1} ${x-ww*.35} ${y-hh*.45}Q${x-ww*.15} ${y-hh*.7} ${x} ${y-hh}Q${x+ww*.15} ${y-hh*.7} ${x+ww*.35} ${y-hh*.45}Q${x+ww*.55} ${y-hh*.1} ${x+ww} ${y}Z" fill="${k%2?'#1f5240':'#173f36'}"/><path d="M${x} ${y-hh}Q${x+ww*.15} ${y-hh*.7} ${x+ww*.35} ${y-hh*.45}Q${x+ww*.55} ${y-hh*.1} ${x+ww} ${y}L${x} ${y}Z" fill="#000" opacity=".18"/>`;
    if(snow)s+=`<path d="M${x-ww*.6} ${y-hh*.38}Q${x-ww*.3} ${y-hh*.6} ${x} ${y-hh*.8}Q${x+ww*.3} ${y-hh*.6} ${x+ww*.6} ${y-hh*.38}Q${x+ww*.35} ${y-hh*.28} ${x+ww*.2} ${y-hh*.4}Q${x} ${y-hh*.55} ${x-ww*.2} ${y-hh*.4}Q${x-ww*.35} ${y-hh*.28} ${x-ww*.6} ${y-hh*.38}Z" fill="url(#gSnowDeep)"/>`}
  return s;
}

/* ---------- Finale (Tag 24) ---------- */
const normWord = w => String(w||'').toUpperCase().replace(/Ä/g,'AE').replace(/Ö/g,'OE').replace(/Ü/g,'UE').replace(/ß/g,'SS').replace(/[^A-Z]/g,'');

  app.innerHTML = `

  <div class="speech"><div class="avatar">${avatar(solved?'happy':'talk')}</div><div><div class="who">Fips</div><p>${fill(solved?D.outro:D.intro)}</p></div></div>
  <p class="eyebrow" style="margin:18px 0 0">Deine Sternsplitter</p>

function showFinale(){
  const r=rng(Date.now()%1000+1);
  const sp=Array.from({length:40},()=>`<span class="sparkle" style="left:${f1(r()*100)}%;top:${f1(40+r()*60)}%;animation-delay:${f1(r()*3)}s;animation-duration:${f1(2+r()*3)}s"></span>`).join('');
  const el=document.createElement('div'); el.className='finale'; el.setAttribute('role','dialog');
  el.innerHTML=`${sp}<div class="box">
    <p class="eyebrow" style="color:#3a2a1c">24. Dezember · Das Himmelstor</p>
    <h2>Das Tor ist offen!</h2>
    <svg class="fips" viewBox="-115 -252 230 264" aria-hidden="true">${DEFS}${fips(0,0,1,'happy')}</svg>
    <p class="wish">Frohe Weihnachten für dich!</p>
    <p>»Danke, ${nameOf()}«, sagt das Christkind. »Vierundzwanzig Schlösser, vierundzwanzig Rätsel – und du hast kein einziges Mal aufgegeben. Fips und ich wünschen dir einen leuchtenden Heiligen Abend.«</p>
    <p class="note-small" style="color:#3a2a1c">${Object.values(S.solved).filter(v=>v&&!v.hints).length} von 24 Schlössern hast du ganz ohne Tipp geöffnet.</p>
    <button class="btn" id="finClose">Zurück in die Werkstatt</button></div>`;
  document.body.appendChild(el); $('#finClose').onclick=()=>{el.remove();renderRoom(24)}; $('#finClose').focus();
}

/* ---------- Overlays ---------- */
const ov=$('#ov');
let lastFocus=null;
function openOv(html,cls=''){
  lastFocus=document.activeElement;
  ov.innerHTML=`<div class="sheet ${cls}" role="dialog" aria-modal="true">${html}<button class="icon-btn x" id="ovX" aria-label="Schließen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>`;
  ov.hidden=false; $('#ovX').onclick=closeOv; $('#ovX').focus();
}
function closeOv(){ov.hidden=true;ov.innerHTML='';if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
ov.addEventListener('click',e=>{if(e.target===ov)closeOv()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&!ov.hidden)closeOv()});

function openSpot(p){
  if(p.note){ openOv(`<h3>${esc(p.t)}</h3><div class="paper">${p.html}</div>`); return }
  const pad=p.pad??8;
  let zx=p.x-pad,zy=p.y-pad,zw=p.w+pad*2,zh=p.h+pad*2;
  if(p.z){[zx,zy,zw,zh]=p.z}else{const mw=240,mh=180;if(zw<mw){zx-=(mw-zw)/2;zw=mw}if(zh<mh){zy-=(mh-zh)/2;zh=mh}if(zw<zh*.9){const nw=zh*.9;zx-=(nw-zw)/2;zw=nw}}zw=Math.min(zw,1000);zh=Math.min(zh,625);zx=Math.max(0,Math.min(1000-zw,zx));zy=Math.max(0,Math.min(625-zh,zy));
  openOv(`<h3>${esc(p.t)}</h3><div class="zoomview"><svg viewBox="${p.zsvg?p.vb:`${zx} ${zy} ${zw} ${zh}`}" role="img" aria-label="${esc(p.t)} aus der Nähe">${p.zsvg?p.zsvg():`<use href="#art"/>${p.zoom?p.zoom():''}`}</svg></div>${p.after||''}
   <div class="speech" style="margin:0"><div class="avatar">${avatar('talk')}</div><div><div class="who">Fips</div><p>${esc(p.c)}</p></div></div>`);
  if(p.init)p.init();
}

function openHints(){
  const D=DAYS[CUR]; const used=S.hints[CUR]||0;
  const names=['Tipp 1','Tipp 2','Lösung'];
  const list=D.hints.map((h,i)=>i<used?`<div class="hint"><b>${names[i]}</b><p>${esc(h)}</p></div>`:'').join('');
  const nextBtn = used<3 ? `<button class="btn ${used===2?'ghost':''}" id="revealBtn">${names[used]} aufdecken</button>` : '';
  openOv(`<h3>Tipps für ${esc(D.room)}</h3><div class="hints">${list||'<p class="note-small" style="margin:0">Noch kein Tipp aufgedeckt. Lass dir ruhig Zeit – die Tipps laufen dir nicht davon.</p>'}</div>${nextBtn}`);
  const rb=$('#revealBtn');
  if(rb) rb.onclick=()=>{
    if(used===2&&!rb.dataset.sure){rb.dataset.sure='1';rb.textContent='Sicher? Dann siehst du die Lösung';return}
    S.hints[CUR]=used+1;save();tick();openHints();
  };
}

/* =========================================================
   CHIFFRIERSCHEIBE
   ========================================================= */
const RINGS=[
  {n:12, r0:240, r1:304, item:272, fill:'#2e5a52', alt:'#264c45'},
  {n:10, r0:178, r1:238, item:208, fill:'#5c3a22', alt:'#6b4428'},
  {n:10, r0:118, r1:176, item:147, fill:'#2e5a52', alt:'#264c45'},
  {n:10, r0:60,  r1:116, item:88,  fill:'#5c3a22', alt:'#6b4428'}
];
let DEC={idx:[0,0,0,0], rot:[0,0,0,0]};
function annulusSeg(r0,r1,a0,a1){const p=(r,a)=>`${f1(Math.sin(rad(a))*r)} ${f1(-Math.cos(rad(a))*r)}`;return `M${p(r1,a0)}A${r1} ${r1} 0 0 1 ${p(r1,a1)}L${p(r0,a1)}A${r0} ${r0} 0 0 0 ${p(r0,a0)}Z`}
function ringSvg(k){
  const R=RINGS[k],seg=360/R.n;let s='';
  for(let i=0;i<R.n;i++){
    s+=`<path d="${annulusSeg(R.r0,R.r1,i*seg-seg/2,i*seg+seg/2)}" fill="${i%2?R.alt:R.fill}" stroke="#1a1410" stroke-width="1.5"/>`;
    s+=`<g transform="rotate(${i*seg}) translate(0 ${-R.item})">${k===0?`<g transform="scale(1.45)">${SYM[i][1]('#ffd27a')}</g>`:`<text y="2" font-family="Fredoka,Trebuchet MS,sans-serif" font-weight="700" font-size="${k===3?30:36}" fill="#f8eedb" text-anchor="middle" dominant-baseline="central">${i}</text>`}</g>`;
  }
  return `<g class="ring" data-k="${k}" tabindex="0" role="slider" aria-label="${k===0?'Symbolring':'Ziffernring '+k}" aria-valuemin="0" aria-valuemax="${R.n-1}"><g class="rot" style="transform:rotate(${DEC.rot[k]}deg)">${s}</g></g>`;
}
function openDecoder(){
  const D=DAYS[CUR];
  openOv(`<h3>Chiffrierscheibe</h3>
  <svg class="disc" id="disc" viewBox="-316 -316 632 632" aria-label="Chiffrierscheibe mit vier drehbaren Ringen">
    ${DEFS}
    <circle r="314" fill="#3e2716"/><circle r="308" fill="url(#gBrass)"/>
    ${RINGS.map((_,k)=>ringSvg(k)).join('')}
    <circle r="58" fill="#2a1f17" stroke="url(#gBrass)" stroke-width="5"/>
    <clipPath id="hubClip"><circle r="54"/></clipPath><g clip-path="url(#hubClip)"><circle r="54" fill="#3448a6"/><g transform="scale(.42) translate(0 124)">${fips(0,0,1,'happy')}</g></g>
    <path d="${annulusSeg(58,310,-17,17)}" fill="#ffd27a" fill-opacity=".14" stroke="#ffd27a" stroke-width="4" pointer-events="none"/>
    <path d="M0-306l-14-20h28z" fill="#cf4a35" stroke="#1a1410" stroke-width="2" pointer-events="none"/>
  </svg>
  <div class="readout"><div class="code" id="readout"></div><button class="btn" id="tryBtn">Am Schloss probieren</button></div>
  <p class="msg" id="decMsg" aria-live="polite"></p>
  <p class="dhelp">Ringe drehen: wischen oder antippen. Außen das Zeichen von der Tür, dann von außen nach innen die drei Ziffern. Abgelesen wird im hellen Fenster oben.</p>`,'decoder');
  const disc=$('#disc'); const rings=[...disc.querySelectorAll('.ring')];
  const setRing=(k,deg,snap)=>{DEC.rot[k]=deg;const g=rings[k].querySelector('.rot');g.style.transform=`rotate(${deg}deg)`;rings[k].classList.toggle('drag',!snap)};
  const readout=()=>{const r=$('#readout');r.innerHTML=symSvg(DEC.idx[0],'#ffd27a',48)+DEC.idx.slice(1).map(d=>`<span>${d}</span>`).join('');rings.forEach((g,k)=>{g.setAttribute('aria-valuenow',DEC.idx[k]);g.setAttribute('aria-valuetext',k===0?SYM[DEC.idx[0]][0]:String(DEC.idx[k]))})};
  const setIdx=(k,i)=>{const n=RINGS[k].n,seg=360/n;i=((i%n)+n)%n;const cur=DEC.rot[k];let target=-i*seg;target+=Math.round((cur-target)/360)*360;DEC.idx[k]=i;setRing(k,target,true);readout()};
  readout();
  const toSvg=e=>{const p=disc.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(disc.getScreenCTM().inverse())};
  const ang=p=>Math.atan2(p.x,-p.y)*180/Math.PI;
  let drag=null;
  disc.addEventListener('pointerdown',e=>{
    const p=toSvg(e),r=Math.hypot(p.x,p.y);const k=RINGS.findIndex(R=>r>=R.r0&&r<=R.r1);if(k<0)return;
    audio();drag={k,last:ang(p),acc:0,start:DEC.rot[k],id:e.pointerId,lastTick:DEC.idx[k]};disc.setPointerCapture(e.pointerId);rings[k].classList.add('drag');e.preventDefault();
  });
  disc.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;const a=ang(toSvg(e));let d=a-drag.last;if(d>180)d-=360;if(d<-180)d+=360;drag.last=a;drag.acc+=d;
    setRing(drag.k,drag.start+drag.acc,false);
    const n=RINGS[drag.k].n,seg=360/n,i=((Math.round(-(drag.start+drag.acc)/seg)%n)+n)%n;if(i!==drag.lastTick){drag.lastTick=i;tick()}
  });
  const end=e=>{
    if(!drag||e.pointerId!==drag.id)return;const {k,acc,start}=drag;drag=null;
    const n=RINGS[k].n,seg=360/n;
    if(Math.abs(acc)<4){tick();setIdx(k,DEC.idx[k]+1)}else{const i=Math.round(-(start+acc)/seg);DEC.rot[k]=start+acc;setIdx(k,i)}
  };
  disc.addEventListener('pointerup',end);disc.addEventListener('pointercancel',end);
  rings.forEach((g,k)=>g.addEventListener('keydown',e=>{if(['ArrowRight','ArrowUp'].includes(e.key)){setIdx(k,DEC.idx[k]+1);tick();e.preventDefault()}if(['ArrowLeft','ArrowDown'].includes(e.key)){setIdx(k,DEC.idx[k]-1);tick();e.preventDefault()}}));
  $('#tryBtn').onclick=()=>{
    audio();
    const key=`fips|${CUR}|${DEC.idx[0]}|${DEC.idx.slice(1).join('')}`;
    if(fnv(key)===D.hash){solve()}
    else{
      S.tries[CUR]=(S.tries[CUR]||0)+1;save();thud();try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}
      const sh=$('.sheet');sh.classList.remove('shake');void sh.offsetWidth;sh.classList.add('shake');
      const lines=['Klack. Nichts passiert.','Das Schloss bleibt zu.','Fips rüttelt an der Tür. Nichts.','Hm. Irgendwas stimmt noch nicht.'];
      $('#decMsg').textContent=lines[(S.tries[CUR])%lines.length];
    }
  };
}
function solve(){
  const n=CUR,D=DAYS[n],first=!S.solved[n];
  S.solved[n]={t:Date.now(),hints:S.hints[n]||0};save();chime();
  renderRoom(n);
  const nextOpen=dayState(n+1)==='open';
  openOv(`<div class="center"><p class="eyebrow">${n}. Dezember · ${esc(D.room)}</p><h3 style="padding:0;margin-top:4px">Das Schloss ist offen!</h3></div>
  <div class="win-shard">${LETTERS[n-1]}</div>
  <div class="speech" style="margin:0"><div class="avatar">${avatar('happy')}</div><div><div class="who">Fips</div><p>${fill(D.outro)}</p></div></div>
  <p class="note-small center" style="margin:0">${first?`Sternsplitter ${Object.keys(S.solved).length} von 24${(S.hints[n]||0)?'':' – ganz ohne Tipp!'}`:'Schon gelöst – aber schön, dass du nochmal vorbeischaust.'}</p>
  <div class="actions" style="justify-content:center;margin:0;position:static;padding:0;background:none">${nextOpen?`<button class="btn" id="sNext">Weiter zu Türchen ${n+1}</button>`:''}<button class="btn ${nextOpen?'ghost':''}" id="sCal">Zum Kalender</button></div>
  ${!nextOpen&&n<24?`<p class="note-small center" style="margin:0">${hasContent(n+1)?'Das nächste Türchen öffnet sich morgen.':'Mehr Türchen folgen bald.'}</p>`:''}`);
  const sn=$('#sNext');if(sn)sn.onclick=()=>{closeOv();renderRoom(n+1)};
  $('#sCal').onclick=()=>{closeOv();renderCalendar()};
}

/* ---------- Start ---------- */
const hot = window.claude?.hot;
function start(){ if(S.name) renderCalendar(); else renderIntro() }
hot?.snapshot?.(()=>({}));
hot?.ready ? hot.ready(start) : start();
})();
</script>
